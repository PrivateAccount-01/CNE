name: CNE correctness and security

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence directory before any gate
        shell: bash
        run: mkdir -p artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install, verify frozen bytes, collect and execute full CNE suite
        env:
          CNE_CI_JOB: full-suite
        run: python -m cne.platform.ci_runner --suite core --install-profile platform,dev --output artifacts/core
      - name: Publish real status even when setup, integrity or collection failed
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/core/summary.md ]]; then
            cat artifacts/core/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'INCOMPLETE: required runner did not produce evidence; tests are not attested.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cne-test-evidence
          path: artifacts/
          if-no-files-found: error

  python-compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Clean base and runtime wheel contracts outside source directory
        run: python -m cne.platform.install_smoke --output artifacts/install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
          if-no-files-found: error

  field-runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Required exporter fixture dependency, no PyTorch
        run: python -m pip install onnx==1.17.0
      - name: Required real CPU ONNX fixture and tampering tests
        env:
          CNE_CI_JOB: field-runtime
        run: python -m cne.platform.ci_runner --suite runtime --install-profile dev,field-runtime --output artifacts/runtime
      - name: Windows/Linux integrity and evidence adversarial tests
        run: python -m pytest cne/tests/platform/test_ci_integrity.py cne/tests/platform/test_ci_evidence.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-runtime-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error

  field-analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: CPU-only training-test libraries (synthetic fixtures, no trained-quality claim)
        run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Product collection and full product tests with mandatory ONNX fixture
        env:
          CNE_CI_JOB: field-analyst
        run: python -m cne.platform.ci_runner --suite field --install-profile platform,dev,field-test --output artifacts/field
      - name: Compile actual product code, not downloaded data or environments
        run: python -m compileall -q field_analyst -x '[/\\](data|runs|deploy|\.venv|reports)[/\\]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-analyst-evidence
          path: artifacts/
          if-no-files-found: error

  optional-gguf-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, cne-licensed-model]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence directory
        run: python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[platform,gguf]'
      - name: Run licensed local model smoke
        env:
          CNE_GGUF_PATH: ${{ vars.CNE_GGUF_PATH }}
          CNE_GGUF_SHA256: ${{ vars.CNE_GGUF_SHA256 }}
          CNE_GGUF_MODEL_ID: ${{ vars.CNE_GGUF_MODEL_ID }}
          CNE_GGUF_LICENSE: ${{ vars.CNE_GGUF_LICENSE }}
        run: python -m cne.platform.gguf_smoke --output artifacts/gguf-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-licensed-gguf-evidence
          path: artifacts/
