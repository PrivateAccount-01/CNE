name: CNE correctness and security

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[platform,dev]'
      - name: Verify frozen blind corpus and gold summary
        shell: bash
        run: |
          echo 'ed56f7665b1a05159460362f806cd56f712afedc948a0613c4024a2df309f3bd  cne/artifacts/p1_dataset/test_heldout_blind.jsonl' | sha256sum --check
          echo '4c27bf9107c05dd68bed5d0209c7c0163e57ff622fa52c30fb8000e239ba1bf9  cne/artifacts/p1_dataset/dataset_summary.json' | sha256sum --check
      - name: Prepare artifact directory
        run: mkdir -p artifacts
      - name: Collect expected test inventory
        id: inventory
        env:
          CNE_TEST_INVENTORY_PATH: artifacts/expected-inventory.json
        run: python -m pytest cne/tests --collect-only -q -p cne.platform.pytest_inventory
      - name: Full correctness and security suite
        id: full-suite
        continue-on-error: true
        env:
          CNE_TEST_INVENTORY_PATH: artifacts/actual-inventory.json
        run: python -m pytest cne/tests -p cne.platform.pytest_inventory --junitxml=artifacts/junit.xml
      - name: Build source-bound evidence and test summary
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [[ '${{ steps.inventory.outcome }}' == 'success' && '${{ steps.full-suite.outcome }}' == 'success' ]]; then result=0; else result=1; fi
          python -m cne.platform.evidence \
            --root . \
            --command 'python -m pytest cne/tests -p cne.platform.pytest_inventory --junitxml=artifacts/junit.xml' \
            --junit artifacts/junit.xml \
            --corpus cne/artifacts/p1_dataset/test_heldout_blind.jsonl \
            --expected-inventory artifacts/expected-inventory.json \
            --actual-inventory artifacts/actual-inventory.json \
            --output artifacts/evidence.json \
            --exit-code "$result" \
            --full-suite \
            --ci-job full-suite | tee artifacts/summary.txt
          cat artifacts/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cne-test-evidence
          path: artifacts/

  optional-gguf-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, cne-licensed-model]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[platform,gguf]'
      - name: Run licensed local model smoke
        env:
          CNE_GGUF_PATH: ${{ vars.CNE_GGUF_PATH }}
          CNE_GGUF_SHA256: ${{ vars.CNE_GGUF_SHA256 }}
          CNE_GGUF_MODEL_ID: ${{ vars.CNE_GGUF_MODEL_ID }}
          CNE_GGUF_LICENSE: ${{ vars.CNE_GGUF_LICENSE }}
        run: python -m cne.platform.gguf_smoke --output artifacts/gguf-smoke.json

  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[platform,dev]'
      - run: python -m compileall -q cne
      - run: python -c "import cne.compiler.constrained_decoder; import cne.platform.runtime_config"
