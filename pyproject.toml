[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cne"
version = "1.5.0"
description = "Computation Necessity Engine (CNE): Local execution system for necessity-driven computation reduction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "PrivateAccount-01" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Hardware :: Symmetric Multi-processing",
]
dependencies = []

[project.optional-dependencies]
platform = ["psutil>=5.9", "cryptography>=42"]
gguf = ["psutil>=5.9", "llama-cpp-python>=0.3"]
training = ["torch>=2.2", "transformers>=4.55,<4.56", "peft==0.17.1", "gguf>=0.19", "numpy>=1.26,<2"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=5.0.0",
    "hypothesis>=6.90.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cne*"]

[tool.pytest.ini_options]
testpaths = ["cne/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
