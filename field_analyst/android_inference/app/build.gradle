plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'org.cne.fieldanalyst.inference'
    compileSdk 35
    defaultConfig {
        applicationId 'org.cne.fieldanalyst.inference'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2-experimental'
        ndk { abiFilters(project.findProperty('targetAbi') ?: 'arm64-v8a') }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main { assets.srcDirs += '../generated/assets' }
        androidTest { assets.srcDirs += '../generated/test-assets' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version '3.11'
        if (project.hasProperty('buildPython')) { buildPython project.property('buildPython') }
        pip { install 'numpy==1.26.2'; install 'Pillow==11.0.0' }
        extractPackages 'cne', 'field_analyst'
        pyc { src = false }
    }
    sourceSets { main { srcDir '../generated/python' } }
}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
